name: Check SortLab
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/main.js && node --check src/visual.js && node --check src/image-sort.js && node --check src/settings-ui.js && node --check src/palette.js && node --check src/extra-classic.js && node --check src/extra-advanced.js
      - run: npm test
      - name: Browser smoke tests
        run: node tests/browser-smoke.mjs
