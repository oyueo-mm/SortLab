name: Collect public-domain art presets
on:
  push:
    branches: [feat/new-sorts-classic-art-20261118]
    paths:
      - .github/workflows/collect-artworks.yml
      - scripts/prepare_artworks.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing tool
        run: python -m pip install Pillow==11.3.0
      - name: Download rights-audited Wikimedia Commons images
        run: python scripts/prepare_artworks.py
      - name: Verify seven converted WebP images
        run: |
          python - <<'PY'
          import pathlib
          from PIL import Image
          folder = pathlib.Path('assets/art')
          images = sorted(folder.glob('*.webp'))
          assert len(images) == 7, f'Expected 7 images, got {len(images)}'
          for img in images:
              with Image.open(img) as im:
                  im.verify()
              assert img.stat().st_size >= 12000, f'Asset too small: {img}'
              print(img, img.stat().st_size)
          PY
      - name: Commit optimized artworks to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle seven rights-audited public-domain art presets"
            git push origin HEAD:feat/new-sorts-classic-art-20261118
          fi
